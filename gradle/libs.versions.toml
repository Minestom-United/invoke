[versions]
minestomCodec = "0.1.0"
junit = "6.1.3"
vanniktechPublish = "0.37.0"
gradlePluginPublish = "2.2.1"

[libraries]
minestom-codec = { module = "dev.minestom-united:codec", version.ref = "minestomCodec" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }

[plugins]
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradlePluginPublish" }
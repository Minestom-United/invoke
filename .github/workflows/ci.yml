name: build

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      status: ${{ steps.version.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build
        run: ./gradlew build

      - name: Determine version
        id: version
        run: |
          VERSION="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            STATUS=snapshot
          else
            STATUS=release
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION ($STATUS) on $GITHUB_REF"
          echo "### Version: \`$VERSION\` ($STATUS)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the tag and release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check for existing release
        id: existing
        if: needs.build.outputs.status == 'release'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ needs.build.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ needs.build.outputs.version }} already exists, skipping release"
            echo "### Tag \`v${{ needs.build.outputs.version }}\` already exists, nothing released" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish snapshot
        if: needs.build.outputs.status == 'snapshot'
        run: >
          ./gradlew
          publishAllPublicationsToMinestomUnitedRepositoryRepository
          publishAllPublicationsToMavenCentralRepository
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Publish release
        if: needs.build.outputs.status == 'release' && steps.existing.outputs.exists == 'false'
        run: >
          ./gradlew
          publishAllPublicationsToMinestomUnitedRepositoryRepository
          publishAllPublicationsToMavenCentralRepository
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create tag and GitHub release
        if: needs.build.outputs.status == 'release' && steps.existing.outputs.exists == 'false'
        run: >
          gh release create "v${{ needs.build.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "v${{ needs.build.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}